  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1450" cy="60" r="220" fill="#51e5c2" opacity=".06"/>
  <circle cx="120" cy="570" r="250" fill="#60a5fa" opacity=".07"/>

