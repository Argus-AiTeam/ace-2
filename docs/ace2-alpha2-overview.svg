<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">ACE-2 Alpha 2 accelerator overview</title>
  <desc id="desc">Architecture flow and certified metrics for the ACE-2 Qwen W4A8 accelerator.</desc>
  <defs>
